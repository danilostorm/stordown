[package]
name = "stordown-desktop"
version = "0.1.0"
description = "StorDown desktop application"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stordown-core = { path = "../../../crates/stordown-core" }
tauri = { version = "2", features = [] }
tokio.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
